<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaTrack — Daftar</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <main class="screen">
    <h1 data-en="Sign Up">Daftar Akaun</h1>
    <p data-en="Start tracking your daily hydration in seconds.">Mula jejak hidrasi harian kau dalam beberapa saat.</p>

    <form class="stack" style="margin-top:var(--space-4);" onsubmit="return handleSignup(event)">
      <div class="field">
        <label for="name" data-en="Name">Nama</label>
        <input type="text" id="name" required placeholder="Nama kau" />
      </div>
      <div class="field">
        <label for="email" data-en="Email">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com" />
      </div>
      <div class="field">
        <label for="password" data-en="Password">Kata Laluan</label>
        <input type="password" id="password" required minlength="4" placeholder="Sekurangnya 4 aksara" />
      </div>
      <p id="error-msg" style="color:#EB5757; display:none;"></p>
      <button type="submit" class="btn" data-en="Sign Up">Daftar</button>
    </form>

    <p style="text-align:center; margin-top:var(--space-4);">
      <span data-en="Already have an account?">Dah ada akaun?</span> <a href="login.html" class="top-link" data-en="Log In">Log Masuk</a>
    </p>
  </main>

  <script src="https://unpkg.com/dexie@4/dist/dexie.js"></script>
  <script src="../js/db.js"></script>
  <script type="module">
    import { auth } from "../js/firebase-config.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    // Firebase Auth handles the real account (email + password, securely).
    // Dexie still holds this device's cached profile (name, weight, goal,
    // etc.) — linked to the Firebase account via firebaseUid. See
    // FIREBASE_SETUP.md, Bahagian C ("Firebase untuk Auth sahaja").
    window.handleSignup = async function (event) {
      event.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");
      const lang = localStorage.getItem("aquatrack_lang") || "ms";

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        const newLocalId = await db.userProfile.add({ name, email, firebaseUid: uid });
        localStorage.setItem("aquatrack_loggedInUserId", newLocalId);
        window.location.href = "profile-setup.html";
      } catch (error) {
        errorMsg.textContent =
          error.code === "auth/email-already-in-use"
            ? (lang === "en" ? "This email is already registered. Please log in." : "Email ni dah didaftarkan. Sila log masuk.")
            : (lang === "en" ? "Sign up failed. Please try again." : "Pendaftaran gagal. Sila cuba lagi.");
        errorMsg.style.display = "block";
      }
      return false;
    };
  </script>
  <script src="../js/i18n.js"></script>
</body>
</html>
